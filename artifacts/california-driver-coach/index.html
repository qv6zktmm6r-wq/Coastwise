<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Coastwise — California Teen Driver Coach</title>
    <meta name="description" content="Practice California permit questions, build real-world driving judgment, and track supervised driving progress with a calm teen-and-parent coach." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Coastwise — California Teen Driver Coach" />
    <meta property="og:description" content="Prepare for the California permit test, practice safer driving decisions, and track supervised driving progress with Coastwise." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coastwise — California Teen Driver Coach" />
    <meta name="twitter:description" content="Prepare for the California permit test, practice safer driving decisions, and track supervised driving progress with Coastwise." />
    <meta name="theme-color" content="#0084FF" />
    <script>
      (() => {
        const root = document.documentElement;
        let appearance = 'system';

        try {
          const saved = window.localStorage.getItem('california-driver-coach');
          if (saved) {
            const parsed = JSON.parse(saved);
            const candidate = parsed?.settings?.appearance;
            if (candidate === 'light' || candidate === 'dark' || candidate === 'system') {
              appearance = candidate;
            }
          }
        } catch {
          // Use the device preference when saved appearance data is unavailable.
        }

        let prefersDark = false;
        try {
          prefersDark = typeof window.matchMedia === 'function'
            && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch {
          // Keep the light default when the device preference is unavailable.
        }

        const dark = appearance === 'dark' || (appearance === 'system' && prefersDark);
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
