kind = "web"
previewPath = "/"
title = "Coastwise — Driving Practice Companion"
description = "A calm co-pilot for learning, practice, and safer driving decisions across permit study and supervised drives."
version = "1.0.0"
id = "artifacts/california-driver-coach"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20453

[services.development]
run = "pnpm --filter @workspace/california-driver-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/california-driver-coach", "run", "build" ]
serve = "static"
publicDir = "artifacts/california-driver-coach/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20453"
BASE_PATH = "/"
