openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: routes
    description: Skill-based practice route operations
  - name: family
    description: Authenticated family sharing and sync
  - name: ai-coach
    description: Privacy-minimized AI coaching operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /practice-routes:
    post:
      operationId: createPracticeRoute
      tags: [routes]
      summary: Create a skill-based practice loop
      description: Creates a driving loop near the selected start point using a directions service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeRouteInput"
      responses:
        "200":
          description: Practice route created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeRoute"
        "400":
          description: Invalid route request
        "502":
          description: Directions service unavailable
  /ai/drive-debrief:
    post:
      operationId: createDriveDebrief
      tags: [ai-coach]
      summary: Create a private post-drive coaching debrief
      description: Creates a short coaching debrief from a bounded summary. Video, coordinates, route geometry, and recording metadata are not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriveDebriefInput"
      responses:
        "200":
          description: Coaching debrief created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveDebrief"
        "400":
          description: Invalid debrief request
        "429":
          description: Too many debrief requests
        "502":
          description: AI coaching service unavailable
  /ai/next-drive-plan:
    post:
      operationId: createNextDrivePlan
      tags: [ai-coach]
      summary: Create a personalized plan for the next supervised drive
      description: Creates a short plan from bounded progress summaries. Video, routes, coordinates, identity, family notes, and raw answers are not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextDrivePlanInput"
      responses:
        "200":
          description: Next-drive plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextDrivePlan"
        "400":
          description: Invalid plan request
        "429":
          description: Too many plan requests
        "502":
          description: AI coaching service unavailable
  /families/invites:
    post:
      operationId: createFamilyInvite
      tags: [family]
      security: [{ clerk: [] }]
      summary: Create a revocable family invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401": { description: Authentication required }
        "403": { description: Parent role required }
  /families/invites/{token}/accept:
    post:
      operationId: acceptFamilyInvite
      tags: [family]
      security: [{ clerk: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Invite accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMembership"
        "400": { description: Invite invalid or expired }
        "401": { description: Authentication required }
  /families/invites/{token}:
    delete:
      operationId: revokeFamilyInvite
      tags: [family]
      security: [{ clerk: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Invite revoked }
        "403": { description: Parent role required }
  /families/sync:
    get:
      operationId: getFamilySync
      tags: [family]
      security: [{ clerk: [] }]
      responses:
        "200":
          description: Current family state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDocument" }
        "401": { description: Authentication required }
    put:
      operationId: updateFamilySync
      tags: [family]
      security: [{ clerk: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncUpdate" }
      responses:
        "200":
          description: Updated family state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDocument" }
        "409": { description: Revision conflict; state was not overwritten }
        "403": { description: Student cannot update parent-only fields }
  /families/membership:
    get:
      operationId: getFamilyMembership
      tags: [family]
      security: [{ clerk: [] }]
      responses:
        "200":
          description: Current membership and active family members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMembershipSummary" }
        "204": { description: Authenticated account is not part of a family }
        "401": { description: Authentication required }
  /families/members/{memberId}:
    delete:
      operationId: revokeFamilyMember
      tags: [family]
      security: [{ clerk: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Member revoked }
        "403": { description: Parent role required }
components:
  securitySchemes:
    clerk:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PracticeRouteInput:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        durationMinutes:
          type: integer
          enum: [20, 35, 50]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        skills:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            enum: [turns, lane-changes, intersections, parking, speed-control]
      required: [latitude, longitude, durationMinutes, difficulty, skills]
    RouteCoordinate:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required: [latitude, longitude]
    RouteStep:
      type: object
      properties:
        instruction:
          type: string
        distanceMeters:
          type: number
        durationSeconds:
          type: number
        maneuverType:
          type: string
        coachingSkill:
          type: ["string", "null"]
          enum: [turns, lane-changes, intersections, parking, speed-control, null]
        coordinate:
          $ref: "#/components/schemas/RouteCoordinate"
      required: [instruction, distanceMeters, durationSeconds, maneuverType, coachingSkill, coordinate]
    PracticeRoute:
      type: object
      properties:
        id:
          type: string
        distanceMeters:
          type: number
        durationSeconds:
          type: number
        geometry:
          type: array
          items:
            $ref: "#/components/schemas/RouteCoordinate"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RouteStep"
        skills:
          type: array
          items:
            type: string
      required: [id, distanceMeters, durationSeconds, geometry, steps, skills]
    DriveDebriefEvent:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [start, prompt, maneuver, safety]
        title:
          type: string
          minLength: 1
          maxLength: 160
        detail:
          type: string
          maxLength: 500
      required: [kind, title, detail]
    DriveDebriefTopic:
      type: object
      additionalProperties: false
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 120
        mastery:
          type: number
          minimum: 0
          maximum: 100
      required: [topic, mastery]
    DriveDebriefInput:
      type: object
      additionalProperties: false
      properties:
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 600
        distanceMiles:
          type: number
          minimum: 0
          maximum: 500
        night:
          type: boolean
        skills:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 120
        events:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DriveDebriefEvent"
        weakTopics:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DriveDebriefTopic"
      required: [durationMinutes, distanceMiles, night, skills, events, weakTopics]
    DriveDebrief:
      type: object
      additionalProperties: false
      properties:
        headline:
          type: string
          minLength: 1
          maxLength: 120
        win:
          type: string
          minLength: 1
          maxLength: 500
        improvement:
          type: string
          minLength: 1
          maxLength: 500
        nextStep:
          type: string
          minLength: 1
          maxLength: 500
        parentPrompt:
          type: string
          minLength: 1
          maxLength: 300
      required: [headline, win, improvement, nextStep, parentPrompt]
    NextDriveMissionSummary:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, minLength: 1, maxLength: 80 }
        minutes: { type: integer, minimum: 5, maximum: 120 }
      required: [title, category, minutes]
    RecentDriveSummary:
      type: object
      additionalProperties: false
      properties:
        durationMinutes: { type: integer, minimum: 1, maximum: 600 }
        night: { type: boolean }
        skills:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 120 }
        debriefImprovement: { type: ["string", "null"], maxLength: 500 }
        debriefNextStep: { type: ["string", "null"], maxLength: 500 }
      required: [durationMinutes, night, skills, debriefImprovement, debriefNextStep]
    NextDrivePlanInput:
      type: object
      additionalProperties: false
      properties:
        weakTopics:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/DriveDebriefTopic"
        unfinishedMissions:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/NextDriveMissionSummary"
        recentDrives:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/RecentDriveSummary"
      required: [weakTopics, unfinishedMissions, recentDrives]
    NextDrivePlan:
      type: object
      additionalProperties: false
      properties:
        skillFocus: { type: string, minLength: 1, maxLength: 160 }
        durationMinutes: { type: integer, minimum: 10, maximum: 60 }
        parentPrompt: { type: string, minLength: 1, maxLength: 300 }
        safetyGuidance: { type: string, minLength: 1, maxLength: 500 }
        createdAt: { type: string, format: date-time }
      required: [skillFocus, durationMinutes, parentPrompt, safetyGuidance, createdAt]
    CreateInviteInput:
      type: object
      properties:
        role: { type: string, enum: [parent, student] }
        expiresInHours: { type: integer, minimum: 1, maximum: 168, default: 72 }
      required: [role]
    Invite:
      type: object
      properties:
        token: { type: string }
        role: { type: string, enum: [parent, student] }
        expiresAt: { type: string, format: date-time }
      required: [token, role, expiresAt]
    FamilyMembership:
      type: object
      properties:
        memberId: { type: string, format: uuid }
        familyId: { type: string, format: uuid }
        role: { type: string, enum: [parent, student] }
      required: [memberId, familyId, role]
    FamilyMembershipSummary:
      type: object
      properties:
        familyId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        role: { type: string, enum: [parent, student] }
        members:
          type: array
          items: { $ref: "#/components/schemas/FamilyMemberSummary" }
      required: [familyId, memberId, role, members]
    FamilyMemberSummary:
      type: object
      properties:
        memberId: { type: string, format: uuid }
        role: { type: string, enum: [parent, student] }
      required: [memberId, role]
    SyncState:
      type: object
      additionalProperties: true
      description: Sanitized AppState; video bytes and video/blob data are rejected.
    SyncDocument:
      type: object
      properties:
        familyId: { type: string, format: uuid }
        revision: { type: integer, minimum: 0 }
        state: { $ref: "#/components/schemas/SyncState" }
        updatedAt: { type: string, format: date-time }
      required: [familyId, revision, state, updatedAt]
    SyncUpdate:
      type: object
      properties:
        revision: { type: integer, minimum: 0 }
        state: { $ref: "#/components/schemas/SyncState" }
      required: [revision, state]

