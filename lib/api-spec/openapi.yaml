openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: routes
    description: Skill-based practice route operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /practice-routes:
    post:
      operationId: createPracticeRoute
      tags: [routes]
      summary: Create a skill-based practice loop
      description: Creates a driving loop near the selected start point using a directions service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeRouteInput"
      responses:
        "200":
          description: Practice route created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeRoute"
        "400":
          description: Invalid route request
        "502":
          description: Directions service unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PracticeRouteInput:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        durationMinutes:
          type: integer
          enum: [20, 35, 50]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        skills:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            enum: [turns, lane-changes, intersections, parking, speed-control]
      required: [latitude, longitude, durationMinutes, difficulty, skills]
    RouteCoordinate:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required: [latitude, longitude]
    RouteStep:
      type: object
      properties:
        instruction:
          type: string
        distanceMeters:
          type: number
        durationSeconds:
          type: number
        maneuverType:
          type: string
        coachingSkill:
          type: ["string", "null"]
          enum: [turns, lane-changes, intersections, parking, speed-control, null]
        coordinate:
          $ref: "#/components/schemas/RouteCoordinate"
      required: [instruction, distanceMeters, durationSeconds, maneuverType, coachingSkill, coordinate]
    PracticeRoute:
      type: object
      properties:
        id:
          type: string
        distanceMeters:
          type: number
        durationSeconds:
          type: number
        geometry:
          type: array
          items:
            $ref: "#/components/schemas/RouteCoordinate"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RouteStep"
        skills:
          type: array
          items:
            type: string
      required: [id, distanceMeters, durationSeconds, geometry, steps, skills]

